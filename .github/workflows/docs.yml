name: Docs

# Builds the documentation in docs/source with Zensical (configuration: zensical.toml) and
# publishes it to GitHub Pages at https://forkforward.dev/dotnet-cargo/.
#
# Pull requests only build it, in strict mode, so a broken link or a missing page fails the check.
# Pushes to develop build it and publish it.
#
# One-time setup in the repository settings: Pages > Build and deployment > Source: GitHub Actions.
# Leave Custom domain empty here: forkforward.dev is set on the organization site
# (ForkForward/forkforward.github.io), and this site is served under it as /dotnet-cargo/.
# GitHub creates the environment "github-pages" on the first deployment; it accepts deployments
# from the default branch, develop, only.
on:
  push:
    branches:
    - develop
    paths:
    - docs/**
    - zensical.toml
    - .github/workflows/docs.yml
  pull_request:
    branches:
    - develop
    paths:
    - docs/**
    - zensical.toml
    - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer commit replaces a pull request build, but a deployment that has started is allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: docs/requirements.txt
    # The version is pinned in docs/requirements.txt.
    - name: Install Zensical
      run: pip install -r docs/requirements.txt
    - name: Build
      run: zensical build --clean --strict
    - name: Upload site
      if: github.ref == 'refs/heads/develop'
      uses: actions/upload-pages-artifact@v5
      with:
        path: artifacts/docs

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publishes the site
      id-token: write  # proves to GitHub Pages that the site was built by this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
